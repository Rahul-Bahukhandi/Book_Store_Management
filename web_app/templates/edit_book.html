<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Book | BookStore</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
  </head>

  <body class="edit-page">
    <div class="edit-container">
      <!-- Header -->
      <div class="edit-header">
        <div>
          <p class="breadcrumb">Books / Edit Book</p>
          <h1>Edit Book Details</h1>
          <p class="subtitle">Update your book information below.</p>
        </div>

        <a href="{{ url_for('books') }}" class="back-btn"> ← Back to Books </a>
      </div>

      <!-- Edit Form Card -->
      <div class="edit-card">
        <div class="card-heading">
          <div class="book-icon">📚</div>

          <div>
            <h2>Book Information</h2>
            <p>Book ID: #{{ book[0] }}</p>
          </div>
        </div>

        <form
          action="{{ url_for('update_book', book_id=book[0]) }}"
          method="POST"
        >
          <div class="form-grid">
            <!-- Title -->
            <div class="form-group full-width">
              <label>Book Title</label>

              <input
                type="text"
                name="title"
                value="{{ book[1] }}"
                placeholder="Enter book title"
                required
              />
            </div>

            <!-- Author -->
            <div class="form-group">
              <label>Author Name</label>

              <input
                type="text"
                name="author"
                value="{{ book[2] }}"
                placeholder="Enter author name"
                required
              />
            </div>

            <!-- Category -->
            <div class="form-group">
              <label>Category</label>

              <input
                type="text"
                name="category"
                value="{{ book[5] }}"
                placeholder="Enter category"
                required
              />
            </div>

            <!-- Price -->
            <div class="form-group">
              <label>Price (₹)</label>

              <input
                type="number"
                name="price"
                value="{{ book[3] }}"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <!-- Stock -->
            <div class="form-group">
              <label>Available Stock</label>

              <input
                type="number"
                name="stock"
                value="{{ book[4] }}"
                min="0"
                required
              />
            </div>
          </div>

          <!-- Buttons -->
          <div class="form-actions">
            <a href="{{ url_for('books') }}" class="cancel-btn"> Cancel </a>

            <button type="submit" class="save-btn">Save Changes</button>
          </div>
        </form>
      </div>

      <p class="footer-text">Book Store Management System</p>
    </div>
  </body>
</html>
