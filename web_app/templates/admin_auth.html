
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Authentication | BookStoreManagement</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h2>BookStoreManagement</h2>

            <div class="auth-tabs">
                <button type="button" id="loginTab"
                        class="active"
                        onclick="showLogin()">
                    Login
                </button>

                <button type="button" id="signupTab"
                        onclick="showSignup()">
                    Sign Up
                </button>
            </div>

           <!-- TOAST NOTIFICATION -->
            {% if toast %}
            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    showToast(
                        {{ toast.message | tojson }},
                        {{ toast.category | tojson }}
                    );
                });
            </script>
            {% endif %}

            <!-- LOGIN FORM -->
            <form id="loginForm"
                  method="POST"
                  action="{{ url_for('admin_login') }}">

                <h3>Admin Login</h3>

                <input type="text"
                       name="login"
                       placeholder="Email or Phone Number"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">Login</button>

                <p>
                    Don't have an account?
                    <a href="#" onclick="showSignup(); return false;">
                        Sign Up
                    </a>
                </p>

            </form>

            <!-- SIGN UP FORM -->
            <form id="signupForm"
                  method="POST"
                  action="{{ url_for('admin_signup') }}"
                  style="display: none;">

                <h3>Create Admin Account</h3>

                <input type="text"
                       name="username"
                       placeholder="Full Name"
                       required>

                <input type="email"
                       name="email"
                       placeholder="Email Address"
                       required>

                <input type="text"
                       name="phone"
                       placeholder="10 Digit Phone Number"
                       maxlength="10"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm Password"
                       required>

                <button type="submit">Create Account</button>

                <p>
                    Already have an account?
                    <a href="#" onclick="showLogin(); return false;">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </div>

    <script>

        function showLogin() {

            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";

            document.getElementById("loginTab").classList.add("active");
            document.getElementById("signupTab").classList.remove("active");
        }

        function showSignup() {

            document.getElementById("signupForm").style.display = "block";
            document.getElementById("loginForm").style.display = "none";

            document.getElementById("signupTab").classList.add("active");
            document.getElementById("loginTab").classList.remove("active");
        }

    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    {% if toast %}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            showToast(
                {{ toast.message | tojson }},
                {{ toast.category | tojson }}
            );
        });
    </script>
    {% endif %}

</body>
</body>
</html>
