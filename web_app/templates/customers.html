
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="page-container">

    <header class="topbar">
        <h2>Customer Management</h2>
        <a href="/">Back to Dashboard</a>
    </header>

    <!-- Add Customer -->
    <section class="content-box">

        <h2>Register New Customer</h2>

        <form action="/customers/add" method="POST" class="book-form">

            <input type="text"
                   name="name"
                   placeholder="Customer Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="text"
                   name="phone"
                   placeholder="10 Digit Phone Number"
                   maxlength="10"
                   pattern="[0-9]{10}"
                   required>

            <button type="submit">Add Customer</button>

        </form>

    </section>

    <!-- Customer List -->
    <section class="content-box">

        <h2>All Customers</h2>

        <form action="/customers" method="GET" class="search-form">

            <input type="text"
                   name="search"
                   placeholder="Search by name or phone"
                   value="{{ search }}">

            <button type="submit">Search</button>

            <a href="/customers">Reset</a>

        </form>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Customer ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for customer in customers %}

                    <tr>
                        <td>{{ customer[0] }}</td>
                        <td>{{ customer[1] }}</td>
                        <td>{{ customer[2] }}</td>
                        <td>{{ customer[3] }}</td>

                        <td>
                            <a href="/customers/edit/{{ customer[0] }}"
                               class="edit-btn">Edit</a>

                            <form action="/customers/delete/{{ customer[0] }}"
                                  method="POST"
                                  class="delete-form"
                                  onsubmit="return confirm('Are you sure you want to delete this customer?');">

                                <button type="submit"
                                        class="delete-btn">
                                    Delete
                                </button>

                            </form>
                        </td>
                    </tr>

                    {% else %}

                    <tr>
                        <td colspan="5">No customers found.</td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </section>

</div>

</body>
</html>
