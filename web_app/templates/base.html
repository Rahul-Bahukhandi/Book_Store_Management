<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Store Management{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <rect width='100' height='100' rx='20' fill='%231e293b'/>
        <path d='M50 35 C38 25 22 27 15 32 V70 C28 65 40 67 50 76 Z' fill='white'/>
        <path d='M50 35 C62 25 78 27 85 32 V70 C72 65 60 67 50 76 Z' fill='%23cbd5e1'/>
        <path d='M50 35 V76' stroke='%231e293b' stroke-width='3' fill='none'/>
      </svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="dashboard app-layout">
    <aside class="sidebar" id="sidebar">
        <h2 class="logo">BookStore</h2>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('books') }}" class="{% if request.endpoint in ['books', 'edit_book'] %}active{% endif %}">Books</a>
            <a href="{{ url_for('customers') }}" class="{% if request.endpoint in ['customers', 'edit_customer'] %}active{% endif %}">Customers</a>
            <a href="{{ url_for('sales') }}" class="{% if request.endpoint in ['sales', 'view_sale_details'] %}active{% endif %}">Sales</a>
            <a href="{{ url_for('rentals') }}" class="{% if request.endpoint == 'rentals' %}active{% endif %}">Book Rentals</a>
        </nav>
        <a href="{{ url_for('admin_logout') }}" class="logout-btn"><span>↪</span> Logout</a>
    </aside>
    <main class="main-content">
        <div class="layout-menu-row">
            <button id="menuBtn" class="menu-btn" type="button" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">☰</button>
        </div>
        {% block content %}{% endblock %}
    </main>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block page_scripts %}{% endblock %}
</body>
</html>
